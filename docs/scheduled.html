<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scheduled Searches</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Doppio+One&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <nav class="topnav" id="topnav"></nav>

  <div class="wrap">
    <h1>Scheduled Searches</h1>
    <p class="sub">
      Keep a search running automatically — daily or weekly — under your own account.
      Results land here, kept completely separate from your saved jobs list.
    </p>
    <p class="hint" id="authHint" style="display:none;">Sign in (top right) to create or view scheduled searches.</p>

    <div class="card" id="createCard" style="display:none;">
      <h2 style="margin-top:0;">Create a new schedule</h2>
      <div class="field" style="margin-bottom: 6px;">
        <label for="searchInput">Search [supports AND, OR, NOT, "exact phrases", and (grouping)]</label>
        <input type="text" id="searchInput" placeholder='e.g. "data analyst" AND (python OR sql) NOT intern' />
      </div>

      <details class="advanced" open>
        <summary>Parameters</summary>
        <div class="field-row">
          <div class="field">
            <label for="frequencyInput">Frequency</label>
            <select id="frequencyInput">
              <option value="daily">Daily</option>
              <option value="weekly">Weekly</option>
            </select>
          </div>
          <div class="field">
            <label for="jobTypeInput">Job type</label>
            <select id="jobTypeInput">
              <option value="">Any</option>
              <option value="fulltime">Full-time</option>
              <option value="parttime">Part-time</option>
              <option value="internship">Internship</option>
              <option value="contract">Contract</option>
            </select>
          </div>
          <div class="field">
            <label for="resultsInput">Results per site</label>
            <input type="number" id="resultsInput" min="1" max="1000" value="50" />
          </div>
          <div class="field">
            <label for="hoursOldInput">Posted within (hours)</label>
            <input type="number" id="hoursOldInput" min="1" value="24" />
          </div>
        </div>
        <div class="field-row" style="margin-bottom: 6px;">
          <label class="checkline"><input type="checkbox" id="siteIndeed" checked /> Indeed</label>
          <label class="checkline"><input type="checkbox" id="siteLinkedin" checked /> LinkedIn</label>
          <label class="checkline"><input type="checkbox" id="siteGoogle" checked /> Google</label>
          <label class="checkline"><input type="checkbox" id="siteZip" /> ZipRecruiter</label>
          <label class="checkline"><input type="checkbox" id="siteGlassdoor" /> Glassdoor</label>
          <label class="checkline"><input type="checkbox" id="siteBayt" /> Bayt</label>
        </div>
        <div class="field-row">
          <label class="checkline"><input type="checkbox" id="remoteInput" /> Remote only</label>
          <label class="checkline"><input type="checkbox" id="easyApplyInput" /> Easy-apply only</label>
        </div>
      </details>

      <button type="button" class="primary" id="createBtn" style="margin-top: 12px;">Create schedule</button>
      <p class="hint" id="createMsg" style="display:none; margin-top: 10px;"></p>
    </div>

    <div class="card" id="listCard" style="display:none;">
      <h2 style="margin-top:0;">Your schedules</h2>
      <div id="scheduleList"></div>
    </div>

    <div id="resultsSection" style="display:none;">
      <h2 id="resultsTitle">Results</h2>
      <div class="toolbar">
        <span id="resultsMeta" class="hint" style="margin: 0;"></span>
        <span class="spacer"></span>
        <button type="button" id="exportResultsBtn">Export to PDF</button>
        <button type="button" id="closeResultsBtn">Close</button>
      </div>
      <div id="resultsList"></div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="assets/app.js"></script>
<script>
(async function () {
  const App = window.JobSpyApp;
  const user = await App.renderNav("scheduled");

  if (!user) {
    document.getElementById("authHint").style.display = "block";
    return;
  }

  document.getElementById("createCard").style.display = "block";
  document.getElementById("listCard").style.display = "block";

  const searchInput = document.getElementById("searchInput");
  const createBtn = document.getElementById("createBtn");
  const createMsg = document.getElementById("createMsg");
  const scheduleListEl = document.getElementById("scheduleList");

  const resultsSection = document.getElementById("resultsSection");
  const resultsTitle = document.getElementById("resultsTitle");
  const resultsMeta = document.getElementById("resultsMeta");
  const resultsListEl = document.getElementById("resultsList");
  const exportResultsBtn = document.getElementById("exportResultsBtn");
  const closeResultsBtn = document.getElementById("closeResultsBtn");

  let currentResults = [];

  function showMsg(el, text) {
    el.textContent = text;
    el.style.display = text ? "block" : "none";
  }

  createBtn.addEventListener("click", async () => {
    const siteMap = [
      ["siteIndeed", "indeed"], ["siteLinkedin", "linkedin"], ["siteGoogle", "google"],
      ["siteZip", "zip_recruiter"], ["siteGlassdoor", "glassdoor"], ["siteBayt", "bayt"],
    ];
    const sites = siteMap.filter(([id]) => document.getElementById(id).checked).map(([, name]) => name);
    if (sites.length === 0) { showMsg(createMsg, "Select at least one site."); return; }

    const scraperTerm = App.toScraperTerm(searchInput.value) || "jobs";
    const targetLocation = "Singapore"; // fixed — no location box; see scraper/scrape_defaults.py
    const params = {
      site_names: sites.join(","),
      results_wanted: String(document.getElementById("resultsInput").value || "50"),
      hours_old: String(document.getElementById("hoursOldInput").value || "24"),
      job_type: document.getElementById("jobTypeInput").value,
      is_remote: document.getElementById("remoteInput").checked ? "true" : "false",
      easy_apply: document.getElementById("easyApplyInput").checked ? "true" : "false",
      // fixed — no distance box; scraper/scrape_defaults.py resolves a blank
      // value to the scraper's own maximum radius anyway, this just skips
      // sending a smaller one from the client.
    };

    createBtn.disabled = true;
    try {
      await App.createScheduledSearch({
        frequency: document.getElementById("frequencyInput").value,
        searchTerm: scraperTerm,
        location: targetLocation,
        params,
      });
      showMsg(createMsg, "Schedule created — it will run on its next check.");
      searchInput.value = "";
      await refreshSchedules();
    } catch (err) {
      App.logError && App.logError(`Create scheduled search failed: ${err.message}`, err.stack);
      showMsg(createMsg, `Could not create schedule: ${err.message}`);
    } finally {
      createBtn.disabled = false;
    }
  });

  function statusLabel(schedule) {
    if (!schedule.is_active) return "paused";
    return schedule.last_status || "waiting for first run";
  }

  function renderSchedules(schedules) {
    if (schedules.length === 0) {
      scheduleListEl.innerHTML = '<p class="hint" style="margin:0;">No scheduled searches yet. Create one above.</p>';
      return;
    }
    scheduleListEl.innerHTML = schedules.map((s) => {
      const next = s.is_active && s.next_run_at ? new Date(s.next_run_at).toLocaleString() : "—";
      const last = s.last_run_at ? new Date(s.last_run_at).toLocaleString() : "never";
      return `
        <div class="job">
          <div class="body">
            <h3>${App.escapeHtml(s.search_term || "(no term)")} <span class="tag">${App.escapeHtml(s.frequency)}</span> <span class="tag">${App.escapeHtml(statusLabel(s))}</span></h3>
            <div class="company">${App.escapeHtml(s.location || "")} &middot; next run: ${next} &middot; last run: ${last}</div>
            ${s.last_error ? `<div class="hint" style="color: var(--danger); margin:4px 0 0;">${App.escapeHtml(s.last_error)}</div>` : ""}
          </div>
          <button type="button" class="viewBtn" data-id="${App.escapeHtml(s.id)}" data-term="${App.escapeHtml(s.search_term || "")}">View results</button>
          <button type="button" class="toggleBtn" data-id="${App.escapeHtml(s.id)}" data-active="${s.is_active}">${s.is_active ? "Pause" : "Resume"}</button>
          <button type="button" class="danger deleteBtn" data-id="${App.escapeHtml(s.id)}">Delete</button>
        </div>`;
    }).join("");

    scheduleListEl.querySelectorAll(".viewBtn").forEach((btn) => {
      btn.addEventListener("click", async () => {
        try {
          currentResults = await App.getScheduledSearchResults(btn.dataset.id);
          renderResults(btn.dataset.term);
        } catch (err) {
          App.logError && App.logError(`Loading scheduled results failed: ${err.message}`, err.stack);
          alert(`Could not load results: ${err.message}`);
        }
      });
    });
    scheduleListEl.querySelectorAll(".toggleBtn").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const nowActive = btn.dataset.active === "true";
        btn.disabled = true;
        try {
          await App.setScheduledSearchActive(btn.dataset.id, !nowActive);
          await refreshSchedules();
        } catch (err) {
          alert(`Could not update schedule: ${err.message}`);
          btn.disabled = false;
        }
      });
    });
    scheduleListEl.querySelectorAll(".deleteBtn").forEach((btn) => {
      btn.addEventListener("click", async () => {
        if (!confirm("Delete this scheduled search and all of its stored results?")) return;
        btn.disabled = true;
        try {
          await App.deleteScheduledSearch(btn.dataset.id);
          await refreshSchedules();
        } catch (err) {
          alert(`Could not delete schedule: ${err.message}`);
          btn.disabled = false;
        }
      });
    });
  }

  async function refreshSchedules() {
    try {
      const schedules = await App.listScheduledSearches();
      renderSchedules(schedules);
    } catch (err) {
      App.logError && App.logError(`Loading scheduled searches failed: ${err.message}`, err.stack);
      scheduleListEl.innerHTML = `<p class="hint" style="margin:0;">Could not load schedules: ${App.escapeHtml(err.message)}</p>`;
    }
  }

  function renderResults(term) {
    resultsTitle.textContent = `Results for "${term || ""}"`;
    resultsMeta.textContent = `${currentResults.length} job(s)`;
    resultsSection.style.display = "block";
    if (currentResults.length === 0) {
      resultsListEl.innerHTML = '<div class="empty">No results yet — check back after the schedule has run.</div>';
    } else {
      resultsListEl.innerHTML = currentResults.map((job) => `
        <div class="job">
          <div class="body">
            <h3><a href="${App.escapeHtml(job.job_url)}" target="_blank" rel="noopener">${App.escapeHtml(job.title)}</a></h3>
            <div class="company">${App.escapeHtml(job.company)} &middot; ${App.escapeHtml(job.location)}</div>
            <div class="tags">
              ${job.site ? `<span class="tag">${App.escapeHtml(job.site)}</span>` : ""}
              ${job.job_type ? `<span class="tag">${App.escapeHtml(job.job_type)}</span>` : ""}
              ${job.date_posted ? `<span class="tag">${App.escapeHtml(job.date_posted)}</span>` : ""}
            </div>
          </div>
        </div>`).join("");
    }
    resultsSection.scrollIntoView({ behavior: "smooth" });
  }

  exportResultsBtn.addEventListener("click", () => {
    const includeDescription = confirm("Include full job descriptions in the PDF? Click OK for yes, Cancel for no.");
    App.exportJobsToPdf(currentResults, { includeDescription });
  });

  closeResultsBtn.addEventListener("click", () => {
    resultsSection.style.display = "none";
  });

  await refreshSchedules();
})();
</script>
</body>
</html>
