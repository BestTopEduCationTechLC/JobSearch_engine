# Daily: rebuilds docs/data/jobs.json (the public job list) and commits it if
# it changed. Needs no secrets. If the scrape finds nothing, the old file stays.
name: Refresh shared job list

on:
  schedule:
    - cron: "23 22 * * *"   # 06:23 Singapore time
  workflow_dispatch:
    inputs:
      search_term:
        description: "Search term for the public list"
        required: false
        default: "data analyst"
        type: string

permissions:
  contents: write   # to commit docs/data/jobs.json

concurrency:
  group: refresh-shared-jobs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEARCH_TERM: ${{ inputs.search_term || 'data analyst' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install .
      - name: Rebuild the job list
        run: python -m scraper.refresh_shared_jobs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/jobs.json
          if git diff --cached --quiet; then
            echo "No change to commit."
          else
            git commit -m "Refresh shared job list"
            git push
          fi
