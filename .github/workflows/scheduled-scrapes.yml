# Hourly: runs every recurring search that is due, and marks stuck one-off
# searches as failed. Needs repository secrets:
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
name: Scheduled scrapes

on:
  schedule:
    - cron: "7 * * * *"   # minute 7, to stay off the busy top of the hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-scrapes
  cancel-in-progress: false

jobs:
  scheduled:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install .
      - run: python -m scraper.run_scheduled_searches
